name: Actualizar Estadísticas

on:
  schedule:
    # Se ejecuta todos los días a las 03:00 UTC
    - cron: "0 3 * * *"
  push:
    branches:
      - master
    # Evita que el propio commit de las imágenes vuelva a lanzar el workflow
    paths-ignore:
      - "stats-images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generar imágenes de estadísticas
        # Si la API de GitHub falla, el script termina sin tocar las imágenes anteriores
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Guardar imágenes en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Actualizar imágenes de estadísticas"
          file_pattern: "stats-images/*.svg"
          branch: master
