<svg width="300" height="165" viewBox="0 0 300 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId">
  <title id="titleId">Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #0969DA; animation: fadeInAnimation 0.8s ease-in-out forwards; }
    @supports(-moz-appearance: auto) { .header { font-size: 15.5px; } }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #1F2328; }
    .stagger { opacity: 0; animation: fadeInAnimation 0.3s ease-in-out forwards; }
    #rect-mask rect { animation: slideInAnimation 1s ease-in-out forwards; }
    @keyframes slideInAnimation { from { width: 0; } to { width: 250px; } }
    
    @keyframes scaleInAnimation {
      from { transform: translate(-5px, 5px) scale(0); }
      to { transform: translate(-5px, 5px) scale(1); }
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" height="99%" width="299" fill="#FFFFFF" stroke-opacity="0"/>
  <g transform="translate(25, 35)"><text x="0" y="0" class="header">Most Used Languages</text></g>
  <g transform="translate(0, 55)">
    <svg x="25">
      <mask id="rect-mask"><rect x="0" y="0" width="250" height="8" fill="white" rx="5"/></mask>
      <rect mask="url(#rect-mask)" x="0.00" y="0" width="105.79" height="8" fill="#7355dd"/>
      <rect mask="url(#rect-mask)" x="105.79" y="0" width="53.44" height="8" fill="#e34c26"/>
      <rect mask="url(#rect-mask)" x="159.23" y="0" width="42.42" height="8" fill="#b07219"/>
      <rect mask="url(#rect-mask)" x="201.64" y="0" width="35.72" height="8" fill="#A97BFF"/>
      <rect mask="url(#rect-mask)" x="237.37" y="0" width="6.37" height="8" fill="#663399"/>
      <rect mask="url(#rect-mask)" x="243.73" y="0" width="6.27" height="8" fill="#3178c6"/>
      <g transform="translate(0, 25)">
      <g transform="translate(0, 0)">
        <g class="stagger" style="animation-delay: 450ms">
          <circle cx="5" cy="6" r="5" fill="#7355dd"/>
          <text x="15" y="10" class="lang-name">C# 42.32%</text>
        </g>
      </g>
      <g transform="translate(0, 25)">
        <g class="stagger" style="animation-delay: 600ms">
          <circle cx="5" cy="6" r="5" fill="#e34c26"/>
          <text x="15" y="10" class="lang-name">HTML 21.37%</text>
        </g>
      </g>
      <g transform="translate(0, 50)">
        <g class="stagger" style="animation-delay: 750ms">
          <circle cx="5" cy="6" r="5" fill="#b07219"/>
          <text x="15" y="10" class="lang-name">Java 16.97%</text>
        </g>
      </g>
      <g transform="translate(150, 0)">
        <g class="stagger" style="animation-delay: 450ms">
          <circle cx="5" cy="6" r="5" fill="#A97BFF"/>
          <text x="15" y="10" class="lang-name">Kotlin 14.29%</text>
        </g>
      </g>
      <g transform="translate(150, 25)">
        <g class="stagger" style="animation-delay: 600ms">
          <circle cx="5" cy="6" r="5" fill="#663399"/>
          <text x="15" y="10" class="lang-name">CSS 2.55%</text>
        </g>
      </g>
      <g transform="translate(150, 50)">
        <g class="stagger" style="animation-delay: 750ms">
          <circle cx="5" cy="6" r="5" fill="#3178c6"/>
          <text x="15" y="10" class="lang-name">TypeScript 2.51%</text>
        </g>
      </g>
      </g>
    </svg>
  </g>
</svg>
